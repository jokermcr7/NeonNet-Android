name: Build NeonNet APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download libXray
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o /tmp/libxray-android.zip https://github.com/XTLS/libXray/releases/download/v26.11.9/libxray-android.zip
          unzip -j /tmp/libxray-android.zip 'libxray-android/libXray.aar' -d app/libs

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NeonNet-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
